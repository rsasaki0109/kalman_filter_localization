ekf_localization:
  ros__parameters:
    # Doppler is the primary aid when present. Istanbul only contains position,
    # so use displacement course as the explicitly conservative fallback.
    use_gnss_doppler_velocity: true
    use_gnss_doppler_course_yaw: true
    gnss_doppler_fallback_timeout_sec: 1.0
    use_gnss_velocity: true
    gnss_position_velocity_propagate_covariance: false
    gnss_position_velocity_correlation_scale: 2.0
    var_gnss_velocity_xy: 0.01
    var_gnss_velocity_z: 0.25
    use_gnss_course_yaw: true
    var_gnss_course_yaw: 0.05
    min_gnss_course_distance_m: 0.5
    min_gnss_course_speed_mps: 0.5
    max_gnss_course_dt_sec: 2.0
    max_gnss_course_dyaw_rad: 3.141592653589793
    use_nonholonomic_constraint: false
    use_zupt: false
    use_zihr: false
    enable_bias_observability_gate: false
    use_continuous_process_noise_density: false
    use_second_order_state_transition: false
    use_second_order_process_noise: false
    propagation_model: "legacy"
    gnss_position_robust_loss: "none"
    publish_debug_topics: true
