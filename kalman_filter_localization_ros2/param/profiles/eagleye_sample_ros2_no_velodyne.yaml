ekf_localization:
    ros__parameters:
      reference_frame_id: "map"
      robot_frame_id: "base_link"
      gnss_pose_topic: "/gnss_pose"
      imu_topic: "/imu/data_raw"
      odom_topic: "/odom"
      pub_period: 10

      # Tuned on eagleye_sample_ros2_no_velodyne with tools/run_open_data_sweep.py.
      var_imu_w: 0.005
      var_imu_acc: 0.01
      max_imu_dt_sec: 0.5
      var_gnss_xy: 0.2
      var_gnss_z: 0.1
      var_odom_xyz: 0.2

      use_gnss: true
      use_odom: false
