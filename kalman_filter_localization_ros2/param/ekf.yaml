ekf_localization:
    ros__parameters:
      reference_frame_id: "map"
      robot_frame_id: "base_link"
      gnss_pose_topic: "gnss_pose"
      gnss_input_type: "pose"  # "pose" or "navsatfix"
      gnss_navsatfix_topic: "/gnss/fix"
      gnss_navsatfix_use_first_fix_as_origin: true
      gnss_navsatfix_use_position_covariance: false
      gnss_navsatfix_min_variance_xy: 1.0e-4
      gnss_navsatfix_min_variance_z: 1.0e-4
      gnss_navsatfix_max_variance_xy: 100.0
      gnss_navsatfix_max_variance_z: 100.0
      gnss_lever_arm_x: 0.0
      gnss_lever_arm_y: 0.0
      gnss_lever_arm_z: 0.0
      compensate_gnss_delay: false
      gnss_time_offset_sec: 0.0
      max_gnss_delay_compensation_sec: 0.5
      enable_measurement_replay: false
      measurement_history_duration_sec: 1.0
      max_future_measurement_wait_sec: 0.5
      # Optional offline fixed-lag RTS smoother oracle (requires replay): publishes
      # /ekf_localization/smoothed_pose re-conditioned on future measurements.
      # fixed_lag_node_subsample records one node every N IMU samples, shrinking
      # the RTS window so the backward pass stays real-time at IMU rate.
      enable_fixed_lag_smoothing: false
      fixed_lag_duration_sec: 5.0
      fixed_lag_node_subsample: 1
      # gnss_navsatfix_origin_latitude: 35.0
      # gnss_navsatfix_origin_longitude: 139.0
      # gnss_navsatfix_origin_altitude: 0.0
      imu_topic: "imu"
      odom_topic: "odom"
      odom_input_mode: "relative"  # "relative" or absolute robot_localization odometry
      initial_pose_covariance_topic: ""  # geometry_msgs/PoseWithCovarianceStamped, optional
      input_reorder_window_sec: 0.0
      pub_period: 10
      output_odometry_topic: "/current_odometry"
      publish_tf: false
      var_imu_w: 0.01
      var_imu_acc: 0.01
      use_continuous_process_noise_density: false
      use_second_order_state_transition: false
      use_second_order_process_noise: false
      propagation_model: "legacy"
      var_imu_gyro_bias: 0.0
      initial_imu_gyro_bias_covariance: 0.0
      tau_gyro_bias_sec: 3600.0
      var_imu_acc_bias: 0.0
      initial_imu_acc_bias_covariance: 0.0
      initial_position_variance_xy: 100.0
      initial_position_variance_z: 100.0
      initial_velocity_variance_xy: 100.0
      initial_velocity_variance_z: 100.0
      initial_attitude_variance_rp: 100.0
      initial_attitude_variance_yaw: 100.0
      enable_stationary_initialization: false
      stationary_initialization_window_sec: 1.0
      stationary_initialization_min_samples: 50
      stationary_initialization_max_gyro_std_radps: 0.01
      stationary_initialization_max_accel_std_mps2: 0.1
      stationary_initialization_max_accel_norm_error_mps2: 0.3
      tau_acc_bias_sec: 3600.0
      use_imu_orientation: false
      use_imu_orientation_covariance: true
      var_imu_orientation_rpy: 0.01
      use_flat_ground: false
      var_flat_ground_rp: 0.03
      use_nonholonomic_constraint: false
      var_nhc_lateral_velocity: 0.05
      var_nhc_vertical_velocity: 0.02
      min_nhc_forward_speed_mps: 0.5
      nhc_adaptive_yaw_rate_radps: 0.5
      nhc_adaptive_lateral_accel_mps2: 1.5
      max_nhc_variance_scale: 100.0
      vehicle_model_plugin: "kalman_filter_localization/GroundVehicleModel"
      nhc_slip_wheel_innovation_mps: 1.0
      nhc_recovery_samples: 5
      use_wheel_speed: false
      wheel_speed_topic: "/wheel_speed"
      wheel_speed_scale_factor: 1.0
      wheel_speed_use_nonholonomic_constraints: false
      wheel_speed_propagate_cross_state: false
      wheel_speed_nhc_only_during_gnss_outage: false
      wheel_vertical_nhc_gnss_available_variance_scale: 1.0
      wheel_speed_gnss_outage_threshold_sec: 1.0
      estimate_wheel_speed_scale_factor: false
      wheel_scale_window_size: 100
      wheel_scale_min_samples: 20
      wheel_scale_min_speed_mps: 2.78
      wheel_scale_max_yaw_rate_radps: 0.0873
      wheel_scale_min_factor: 0.8
      wheel_scale_max_factor: 1.2
      wheel_scale_max_sample_age_sec: 0.2
      wheel_scale_reference: "gnss"  # "gnss", "odom", or "either"
      var_wheel_speed: 0.04
      var_wheel_lateral_velocity: 0.05
      var_wheel_vertical_velocity: 0.02
      max_wheel_speed_innovation_mps: 5.0
      use_zupt: false
      zupt_max_angular_velocity_radps: 0.02
      zupt_max_acceleration_error_mps2: 0.2
      zupt_max_speed_mps: 0.3
      zupt_min_stationary_duration_sec: 0.5
      var_zupt_velocity: 0.01
      use_zihr: false
      var_zihr_gyro: 1.0e-5
      enable_bias_observability_gate: false
      bias_min_angular_excitation_radps: 0.1
      bias_min_acceleration_excitation_mps2: 0.5
      use_gnss_course_yaw: false
      var_gnss_course_yaw: 0.05
      min_gnss_course_distance_m: 1.0
      min_gnss_course_speed_mps: 0.5
      max_gnss_course_dt_sec: 1.0
      max_gnss_course_dyaw_rad: 3.14159265358979323846
      max_gnss_course_yaw_nis: 0.0  # 0 disables hard NIS gate
      gnss_course_yaw_nis_adaptive_threshold: 0.0  # 0 disables adaptive R
      max_gnss_course_yaw_variance_scale: 1.0
      use_gnss_velocity: false
      propagate_gnss_velocity_cross_state: true
      var_gnss_velocity_xy: 0.25
      var_gnss_velocity_z: 0.5
      min_gnss_velocity_distance_m: 0.0
      max_gnss_velocity_dt_sec: 1.0
      gnss_doppler_fallback_timeout_sec: 1.0
      gnss_position_velocity_correlation_scale: 2.0
      gnss_position_velocity_propagate_covariance: true
      max_gnss_velocity_innovation_mps: 5.0
      max_gnss_velocity_nis: 0.0
      max_imu_dt_sec: 20.0
      gravity_mps2: 9.80665
      var_gnss_xy: 0.1
      var_gnss_z: 0.15
      max_gnss_position_innovation_m: 0.0  # 0 disables hard innovation gate
      max_gnss_position_innovation_clip_m: 0.0  # 0 disables innovation clipping
      max_gnss_position_nis: 0.0  # 0 disables hard NIS gate
      gnss_position_nis_adaptive_threshold: 0.0  # 0 disables adaptive R
      max_gnss_position_variance_scale: 1.0
      gnss_position_robust_loss: "none"  # "none", "huber", or "cauchy"
      gnss_position_robust_tuning: 2.5
      max_gnss_position_robust_variance_scale: 100.0
      gnss_position_reacquisition_dt_sec: 0.0  # 0 disables long-gap reacquisition R scaling
      gnss_position_reacquisition_variance_scale: 1.0
      gnss_position_reacquisition_update_count: 1
      gnss_position_reacquisition_consistent_count: 3
      gnss_position_reacquisition_covariance_cap_xy: 0.0  # 0 disables long-gap covariance cap
      gnss_position_reacquisition_covariance_cap_z: 0.0
      gnss_position_reacquisition_velocity_covariance_cap_xy: 0.0
      gnss_position_reacquisition_velocity_covariance_cap_z: 0.0
      gnss_position_reacquisition_attitude_covariance_cap_rp: 0.0
      gnss_position_reacquisition_attitude_covariance_cap_yaw: 0.0
      gnss_position_reacquisition_reset_position: false
      gnss_position_reacquisition_reset_velocity: false
      gnss_position_innovation_adaptive_threshold_m: 0.0  # 0 disables innovation-norm adaptive R
      max_gnss_position_innovation_variance_scale: 1.0
      var_odom_xyz: 0.2
      use_gnss: true
      use_gnss_doppler_velocity: false
      gnss_doppler_velocity_topic: "/gnss/velocity"
      use_gnss_doppler_velocity_covariance: true
      use_gnss_doppler_course_yaw: false
      min_gnss_doppler_course_speed_mps: 1.0
      use_odom: false
      enable_sensor_fault_isolation: false
      sensor_fault_trip_count: 5
      sensor_fault_hold_sec: 5.0
      publish_debug_topics: false
